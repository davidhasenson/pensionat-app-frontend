apiVersion: apps/v1
kind: Deployment
metadata:
  name: pensionat-app-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pensionat-app-frontend
  template:
    metadata:
      labels:
        app: pensionat-app-frontend
    spec:
      containers:
        - name: pensionat-app-frontend
          image: pensionat-pensionat-app-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: pensionat-app-frontend
spec:
  type: LoadBalancer
  selector:
    app: pensionat-app-frontend
  ports:
    - port: 8080
      targetPort: 80